body{min-height:100dvh;background:#070b12;display:flex;flex-direction:column;padding:16px 18px 36px;position:relative;overflow-x:hidden}

/* ===== Стильный дизайн панели управления (#panel) ===== */

/* Сегмент-переключатель вкладок */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;background:rgba(15,23,36,.88);border:1px solid rgba(255,255,255,.1);border-radius:16px;margin-bottom:14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}

.tile span{font-size:11.5px;font-weight:600;color:#8b9bb4;letter-spacing:.2px}

/* Карточки устройств и строк */
.row,.mr{background:linear-gradient(180deg,rgba(21,30,46,.88) 0%,rgba(13,19,30,.95) 100%);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:13px 14px;margin-bottom:10px;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.3);transition:transform .15s,border-color .2s}

/* Двухрядная сетка карточки водителя во вкладке Онлайн */
.row:has(.rv){display:grid;grid-template-columns:10px 1fr repeat(5,auto);align-items:center;column-gap:7px;row-gap:8px;padding:10px 12px;margin-bottom:8px}
.row:has(.rv) .dot{grid-column:1;grid-row:1;align-self:start;margin-top:6px}
.row:has(.rv) .rm{grid-column:2/-1;grid-row:1;padding-left:4px}
.row:has(.rv) .rv{grid-column:1/3;grid-row:2;justify-self:start;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);width:100%;display:flex;align-items:center;background:none;border-left:none;border-right:none;border-bottom:none;border-radius:0;padding-left:0;padding-right:0;font-size:14px}
.row:has(.rv) .rv::before{content:"";display:none}
.row:has(.rv) .rv-pill{display:inline-block}
.row:has(.rv) .dm-btn,.row:has(.rv) .xb{grid-row:2;margin-top:7px;width:30px;height:30px;border-radius:10px;font-size:13.5px}
.row:has(.rv) [data-act="dm"]{grid-column:3}
.row:has(.rv) [data-act="editname"]{grid-column:4}
.row:has(.rv) [data-act="pin"]{grid-column:5}
.row:has(.rv) [data-act="block"]{grid-column:6}
.row:has(.rv) [data-act="del"]{grid-column:7}

.tar-srch input{width:100%;height:38px;margin:0;padding:0 30px 0 32px;border-radius:11px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#f8fafc}
.tar-srch input:focus{border-color:#fde047}
.tar-srch-clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;border-radius:8px;background:rgba(255,255,255,.1);color:#cbd5e1;font-size:12px;display:flex;align-items:center;justify-content:center}
.tar-flt-btn{height:38px;padding:0 11px;border-radius:11px;font-size:12px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#cbd5e1;white-space:nowrap;flex-shrink:0}
.tar-flt-btn.on{background:rgba(250,204,21,.18);border-color:rgba(250,204,21,.48);color:#fde047}
.tar-list{flex:1;overflow:auto;padding:12px;background-image:none!important;display:block!important}
.tar-cat{margin-bottom:8px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.035);overflow:hidden;transition:border-color .15s}
.tar-cat.open{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.045)}
.tar-cat.has-mod{border-color:rgba(250,204,21,.34)}
.tar-cat-hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 13px;background:transparent;border:none;border-radius:0;color:#f8fafc;text-align:left;cursor:pointer}
.tar-cat-hd:active{background:rgba(255,255,255,.05)}
.tar-cat-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.tar-cat-ic{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tar-cat-nm{font-size:14px;font-weight:700;color:#fde047;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tar-cat-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tar-cat-mod{font-size:10.5px;font-weight:800;color:#fde047;background:rgba(250,204,21,.16);border:1px solid rgba(250,204,21,.42);padding:2px 7px;border-radius:99px}
.tar-cat-cnt{font-size:11.5px;font-weight:700;color:#94a3b8;background:rgba(255,255,255,.07);padding:2px 8px;border-radius:99px}
.tar-cat-ar{color:#94a3b8;font-size:13px;width:14px;text-align:center}
.tar-cat-body{padding:2px 9px 9px;border-top:1px solid rgba(255,255,255,.07)}
.tar-row{background:rgba(7,11,18,.52);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:8px 10px;margin-top:7px;transition:border-color .15s,background .15s}
.tar-row.mod{border-color:rgba(250,204,21,.42);background:rgba(250,204,21,.06)}
.tar-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.tar-row-nm{min-width:0;flex:1}
.tar-row-nm b{font-size:13px;color:#f8fafc;font-weight:700;line-height:1.25}
.tar-mod-dot{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:800;background:rgba(250,204,21,.2);border:1px solid rgba(250,204,21,.45);color:#fde047;vertical-align:middle}
.tar-def{font-size:11px;color:#94a3b8;margin-top:2px}
.tar-row-rst{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fde047;font-size:13px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tar-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.tar-fld{display:flex;flex-direction:column;gap:3px}
.tar-fld span{font-size:10.5px;font-weight:600;color:#94a3b8;padding-left:2px}
.tar-inp{height:36px!important;margin:0!important;padding:0 10px!important;font-size:14px!important;font-weight:700;border-radius:10px!important;border:1px solid rgba(255,255,255,.16)!important;background:rgba(7,11,18,.88)!important;color:#f8fafc!important}
.tar-inp:focus{border-color:#10b981!important}
.tar-inp.bad{border-color:#ef4444!important;background:rgba(239,68,68,.14)!important;color:#fecaca!important}
.tar-fix-tag{height:36px;color:#64748b;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:flex-start;padding:0 4px}
.tar-foot{padding:10px 12px 12px;background:rgba(7,11,18,.94);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.tar-note{font-size:11px;color:#94a3b8;line-height:1.35;margin-bottom:9px}
.tar-foot-acts{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tar-rst-btn{height:44px;padding:0 13px;border-radius:13px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.38);color:#fca5a5;font-size:13px;font-weight:700}
.tar-rst-btn:disabled{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#64748b;cursor:default}
.tar-save-btn{height:44px;border-radius:13px;border:none;background:linear-gradient(135deg,#6ee7b7 0%,#10b981 55%,#059669 100%);color:#042414;font-size:14px;font-weight:800;box-shadow:0 8px 20px rgba(16,185,129,.25)}
.tar-save-btn:disabled{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;box-shadow:none;cursor:default}

<script>
['lgEm','lgPw'].forEach(id=>{
 const el=document.getElementById(id);
 const clean=()=>{
  setTimeout(()=>{
   const v=el.value;
   if(!v)return;
   el.value=v.slice(0,-1);
   el.dispatchEvent(new Event('input',{bubbles:true}));
   el.value=v;
   el.dispatchEvent(new Event('input',{bubbles:true}));
  },50);
 };
 el.addEventListener('change',clean);
 el.addEventListener('animationstart',clean);
});
</script>
