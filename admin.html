<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.back{display:inline-block;color:#fc0;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:12px}
body{min-height:100vh;background:#0f1722;color:#f8fafc;padding:16px 16px 40px;max-width:540px;margin:0 auto}
h2{background:rgba(18,25,36,.75);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;font-size:19px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2 small{font-size:12px;font-weight:400;color:#94a3b8;display:block;margin-top:2px;word-break:break-all}
input,select{width:100%;height:48px;padding:0 14px;font-size:16px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(15,23,34,.82);color:#fff;outline:none;margin-bottom:10px}
input:focus,select:focus{border-color:#10b981}
button{font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,.18);border-radius:12px;cursor:pointer;background:rgba(28,38,52,.85);color:#fff}
.btn{width:100%;padding:13px;margin-top:10px;background:rgba(16,185,129,.18);color:#34d399;border:1.5px solid #10b981}
.btn:disabled{opacity:.5}
.card{background:rgba(18,25,36,.75);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:18px}
.card p{color:#94a3b8;font-size:13px;margin-bottom:14px;line-height:1.5}
#lgMsg{color:#ffd166;font-size:13px;text-align:center;margin-top:10px;min-height:16px}
.out{width:auto;padding:8px 12px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px 4px;font-size:14px}
.tabs button.on{background:#fc0;color:#000;border-color:#fc0}
#err{background:rgba(239,68,68,.18);border:1.5px solid #ef4444;color:#ffb4b4;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 6px;text-align:center}
.tile b{display:block;font-size:24px;color:#34d399}
.tile span{font-size:12px;color:#94a3b8}
.row,.mr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.row{cursor:pointer}
.mr.col{flex-direction:column;align-items:stretch;cursor:pointer}
.mrt{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#64748b;flex-shrink:0}
.dot.on{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:15px}
.rs{font-size:12px;color:#94a3b8;margin-top:2px;word-break:break-word}
.rv{font-weight:800;color:#fc0;font-size:14px;white-space:nowrap;text-align:right}
.rv.warn{color:#fb923c}
.ar{color:#94a3b8}
.xb{width:30px;height:30px;padding:0;flex-shrink:0;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#ff6b6b}
.hero{background:linear-gradient(135deg,#10b981,#0ea5e9);border-radius:16px;padding:14px 16px;margin:4px 0 14px;display:flex;flex-direction:column;gap:2px}
.hero span{font-size:12px;color:rgba(255,255,255,.9)}
.hero a{color:#fff}
.hero b{font-size:24px;font-weight:800}
.sec{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin:14px 4px 8px}
.box{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#cbd5e1}
.mut{color:#94a3b8}
.hint{font-size:12px;text-align:center;margin-top:10px}
.dt{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
.cat{margin-bottom:8px}
.cath{display:flex;justify-content:space-between;gap:8px;color:#fc0;font-weight:700;font-size:14px}
.cath b{color:#34d399;white-space:nowrap}
.it{padding:5px 0 0 6px}
.itn{font-size:13px;font-weight:600}
.pt{display:flex;align-items:center;gap:8px;font-size:12px;color:#cbd5e1;padding:2px 0}
.pt span:nth-child(2){flex:1}
.pt b{color:#fc0;white-space:nowrap}
.tg{background:rgba(255,255,255,.08);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;z-index:300;max-width:88vw;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(18,25,36,.96);border:1.5px solid #10b981;color:#ecfdf5;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:#ef4444;color:#ffb4b4}

body{min-height:100dvh;background:#070b12;display:flex;flex-direction:column;padding:16px 18px 36px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 42%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 80% 65% at 50% 42%,#000 35%,transparent 100%)}
body::after{content:"";position:fixed;width:360px;height:360px;top:-120px;left:50%;transform:translateX(-50%);z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(16,185,129,.22) 0%,rgba(255,204,0,.08) 45%,transparent 72%);filter:blur(40px)}
.back{display:inline-flex;align-items:center;gap:8px;width:fit-content;color:#cbd5e1;font-size:13px;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);margin-bottom:14px}
.auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 20px}
.card{position:relative;background:linear-gradient(180deg,rgba(19,27,41,.9) 0%,rgba(11,16,26,.97) 100%);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:30px 22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.5);backdrop-filter:blur(20px)}
.card::before{content:"";position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(52,211,153,.65),rgba(255,204,0,.5),transparent)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
.logo-ring{width:64px;height:64px;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(52,211,153,.7),rgba(255,204,0,.45),rgba(255,255,255,.08));margin-bottom:14px;box-shadow:0 12px 30px rgba(16,185,129,.18)}
.logo-in{width:100%;height:100%;border-radius:19px;background:#0c1320;display:flex;align-items:center;justify-content:center;color:#34d399}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,204,0,.1);border:1px solid rgba(255,204,0,.28);color:#fc0;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.pill i{width:6px;height:6px;border-radius:50%;background:#fc0;box-shadow:0 0 8px #fc0}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#fff;margin-bottom:5px}
.brand p{font-size:13px;color:#8b9bb4;line-height:1.45}
.fld{position:relative;margin-bottom:14px}
.fld svg.ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;transition:.2s}
.fld input{height:56px;padding:18px 46px 4px 44px;font-size:15.5px;font-weight:500;border-radius:16px;border:1px solid rgba(255,255,255,.11);background:rgba(7,11,18,.78);margin:0;transition:.2s}
.fld label{position:absolute;left:44px;top:50%;transform:translateY(-50%);font-size:14.5px;color:#64748b;pointer-events:none;transition:.18s}
.fld input:focus{border-color:#10b981;background:#070b12;box-shadow:0 0 0 4px rgba(16,185,129,.14)}
.fld input:focus ~ svg.ic{color:#34d399}
.fld input:focus + label,.fld input:not(:placeholder-shown) + label{top:14px;font-size:11px;font-weight:600;color:#34d399}
.fld input:not(:focus):not(:placeholder-shown) + label{color:#94a3b8}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:transparent;color:#64748b;display:flex;align-items:center;justify-content:center;border-radius:11px}
.go-btn{width:100%;height:54px;margin-top:6px;border:none;border-radius:16px;font-size:15.5px;font-weight:700;color:#042414;background:linear-gradient(135deg,#6ee7b7 0%,#10b981 50%,#059669 100%);box-shadow:0 12px 28px rgba(16,185,129,.3),inset 0 1px 0 rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.go-btn:active{transform:scale(.98)}
.go-btn:disabled{opacity:.55}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#64748b}
body:has(#login:not([hidden])){height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none}
.fld input:-webkit-autofill,.fld input:-webkit-autofill:hover,.fld input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #070b12 inset!important;-webkit-text-fill-color:#f8fafc!important;caret-color:#f8fafc;transition:background-color 9999s ease-out 0s}
:root{color-scheme:dark}
.fld input:autofill,.fld input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #070b12 inset!important;box-shadow:0 0 0 1000px #070b12 inset!important;-webkit-text-fill-color:#f8fafc!important;color:#f8fafc!important;background-color:#070b12!important}
.fld{background:#070b12;border-radius:16px}
.fld input{background:transparent!important;-webkit-appearance:none;appearance:none}
.fld input:-webkit-autofill,.fld input:-webkit-autofill:focus,.fld input:autofill{-webkit-box-shadow:0 0 0 100px #070b12 inset!important;box-shadow:0 0 0 100px #070b12 inset!important;-webkit-text-fill-color:#f8fafc!important;background-clip:content-box!important;filter:none!important}
</style></head><body>

 <div class="fld"><input id="lgPw" oninput="this.style.backgroundColor='#070b12'" type="password" autocomplete="current-password" placeholder=" "><label for="lgPw">Пароль</label><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><button type="button" class="eye" aria-label="Показать пароль" onclick="const p=document.getElementById('lgPw'),v=p.type==='password';p.type=v?'text':'password';this.style.color=v?'#34d399':'#64748b'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
 <button id="lgGo" class="go-btn"><span>Войти в систему</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
 <div id="lgMsg"></div>
 <div class="foot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Защищённое соединение Firebase</div>
</div></div>

<div id="panel" hidden>
 <h2><span>🛠 Админ<small id="who"></small></span><button id="out" class="out">Выйти</button></h2>
