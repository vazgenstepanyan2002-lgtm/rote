.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.box{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#cbd5e1}
.mut{color:#94a3b8}
.hint{font-size:12px;text-align:center;margin-top:10px}
.dt{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}

body{min-height:100dvh;background:#070b12;display:flex;flex-direction:column;padding:16px 18px 36px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 42%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 80% 65% at 50% 42%,#000 35%,transparent 100%)}
body::after{content:"";position:fixed;width:360px;height:360px;top:-120px;left:50%;transform:translateX(-50%);z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(16,185,129,.22) 0%,rgba(255,204,0,.08) 45%,transparent 72%);filter:blur(40px)}
.back{display:inline-flex;align-items:center;gap:8px;width:fit-content;color:#cbd5e1;font-size:13px;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);margin-bottom:14px}
.auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 20px}
.card{position:relative;background:linear-gradient(180deg,rgba(19,27,41,.9) 0%,rgba(11,16,26,.97) 100%);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:30px 22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.5);backdrop-filter:blur(20px)}
.card::before{content:"";position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(52,211,153,.65),rgba(255,204,0,.5),transparent)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
.logo-ring{width:64px;height:64px;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(52,211,153,.7),rgba(255,204,0,.45),rgba(255,255,255,.08));margin-bottom:14px;box-shadow:0 12px 30px rgba(16,185,129,.18)}
.logo-in{width:100%;height:100%;border-radius:19px;background:#0c1320;display:flex;align-items:center;justify-content:center;color:#34d399}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,204,0,.1);border:1px solid rgba(255,204,0,.28);color:#fc0;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.pill i{width:6px;height:6px;border-radius:50%;background:#fc0;box-shadow:0 0 8px #fc0}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#fff;margin-bottom:5px}
.brand p{font-size:13px;color:#8b9bb4;line-height:1.45}
.fld{position:relative;margin-bottom:14px}
.fld svg.ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;transition:.2s}
.fld input{height:56px;padding:18px 46px 4px 44px;font-size:15.5px;font-weight:500;border-radius:16px;border:1px solid rgba(255,255,255,.11);background:rgba(7,11,18,.78);margin:0;transition:.2s}
.fld label{position:absolute;left:44px;top:50%;transform:translateY(-50%);font-size:14.5px;color:#64748b;pointer-events:none;transition:.18s}
.fld input:focus{border-color:#10b981;background:#070b12;box-shadow:0 0 0 4px rgba(16,185,129,.14)}
.fld input:focus ~ svg.ic{color:#34d399}
.fld input:focus + label,.fld input:not(:placeholder-shown) + label{top:14px;font-size:11px;font-weight:600;color:#34d399}
.fld input:not(:focus):not(:placeholder-shown) + label{color:#94a3b8}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:transparent;color:#64748b;display:flex;align-items:center;justify-content:center;border-radius:11px}
.go-btn{width:100%;height:54px;margin-top:6px;border:none;border-radius:16px;font-size:15.5px;font-weight:700;color:#042414;background:linear-gradient(135deg,#6ee7b7 0%,#10b981 50%,#059669 100%);box-shadow:0 12px 28px rgba(16,185,129,.3),inset 0 1px 0 rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.go-btn:active{transform:scale(.98)}
.go-btn:disabled{opacity:.55}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#64748b}
body:has(#login:not([hidden])){height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none}

:root{color-scheme:dark}
.fld input:autofill,.fld input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #070b12 inset!important;box-shadow:0 0 0 1000px #070b12 inset!important;-webkit-text-fill-color:#f8fafc!important;color:#f8fafc!important;background-color:#070b12!important}
.fld{background:#070b12;border-radius:16px}
.fld input{background:transparent!important;-webkit-appearance:none;appearance:none}
.fld input:-webkit-autofill,.fld input:-webkit-autofill:focus,.fld input:autofill{-webkit-box-shadow:0 0 0 100px #070b12 inset!important;box-shadow:0 0 0 100px #070b12 inset!important;-webkit-text-fill-color:#f8fafc!important;background-clip:content-box!important;filter:none!important}

#cOv{z-index:600}
.ov{position:fixed;inset:0;z-index:550;overscroll-behavior:contain;touch-action:none;background:rgba(4,7,13,.76);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:auto}
.dlg{position:relative;width:100%;max-width:360px;background:linear-gradient(180deg,rgba(22,31,48,.96),rgba(11,16,26,.99));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px 20px 20px;box-shadow:0 28px 70px rgba(0,0,0,.85);text-align:center;transform:translateY(14px) scale(.96);transition:transform .24s cubic-bezier(.16,1,.3,1)}
.ov.show .dlg{transform:none}
.dlg::before{content:"";position:absolute;top:0;left:28px;right:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(52,211,153,.7),transparent)}
.dlg.danger::before{background:linear-gradient(90deg,transparent,rgba(239,68,68,.75),transparent)}
.dlg-ic{width:54px;height:54px;margin:0 auto 14px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(16,185,129,.14);border:1px solid rgba(52,211,153,.35);color:#34d399;box-shadow:0 10px 24px rgba(16,185,129,.18)}
.dlg.danger .dlg-ic{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.38);color:#f87171;box-shadow:0 10px 24px rgba(239,68,68,.18)}
.dlg-t{font-size:18px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-.2px}
.dlg-m{font-size:13.5px;color:#94a3b8;line-height:1.48;margin-bottom:20px}
.dlg-act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-act button{height:46px;border-radius:14px;font-size:14.5px;font-weight:700;transition:.15s}
.dlg-act button:active{transform:scale(.97)}
.dlg-no{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1}
.dlg-ok{border:none;color:#042414;background:linear-gradient(135deg,#6ee7b7 0%,#10b981 55%,#059669 100%);box-shadow:0 8px 20px rgba(16,185,129,.28)}
.dlg.danger .dlg-ok{color:#fff;background:linear-gradient(135deg,#f87171 0%,#ef4444 55%,#dc2626 100%);box-shadow:0 8px 20px rgba(239,68,68,.3)}

.dlg-inp{width:100%;height:48px;padding:0 14px;font-size:15.5px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(7,11,18,.85);color:#fff;outline:none;margin-bottom:18px;text-align:left}
.dlg-inp:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.16)}

/* ===== Стильный дизайн панели управления (#panel) ===== */
#panel{display:flex;flex-direction:column;gap:2px}
#panel[hidden]{display:none!important}
#panel h2{background:linear-gradient(180deg,rgba(22,31,48,.92) 0%,rgba(13,19,31,.96) 100%);border:1px solid rgba(255,255,255,.11);border-radius:22px;padding:13px 12px;margin-bottom:14px;box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);position:relative;overflow:hidden}
#panel h2::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(52,211,153,.55),rgba(255,204,0,.4),transparent)}
#panel h2>span{display:flex;align-items:center;gap:9px;font-size:17px;min-width:0;flex:1;font-weight:800;letter-spacing:-.2px;color:#fff}
#panel h2 small{font-size:11px;font-weight:500;color:#8b9bb4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:135px}
.out{padding:9px 14px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;transition:.15s}
.out:active{transform:scale(.96);background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.4);color:#fca5a5}

/* Сегмент-переключатель вкладок */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;background:rgba(15,23,36,.88);border:1px solid rgba(255,255,255,.1);border-radius:16px;margin-bottom:14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.tabs button{padding:10px 3px;border-radius:12px;font-size:12.5px;font-weight:700;border:1px solid transparent;background:transparent;color:#94a3b8;transition:.18s}
.tabs button.on{background:linear-gradient(135deg,#fde047 0%,#facc15 55%,#eab308 100%);color:#141102;border-color:rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(250,204,21,.28)}

/* Плитки статистики */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{position:relative;background:linear-gradient(180deg,rgba(22,31,48,.88) 0%,rgba(12,18,29,.95) 100%);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.32);overflow:hidden}
.tile::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:2px;border-radius:2px;background:#34d399;opacity:.75}
.tile:nth-child(2)::after{background:#38bdf8}
.tile:nth-child(3)::after{background:#facc15}
.tile b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:#34d399;margin-bottom:4px}
.tile:nth-child(2) b{color:#38bdf8}
.tile:nth-child(3) b{color:#fde047}
.tile span{font-size:11.5px;font-weight:600;color:#8b9bb4;letter-spacing:.2px}

/* Карточки устройств и строк */
.row,.mr{background:linear-gradient(180deg,rgba(21,30,46,.88) 0%,rgba(13,19,30,.95) 100%);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:13px 14px;margin-bottom:10px;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.3);transition:transform .15s,border-color .2s}
.row:active,.mr.col:active{transform:scale(.99);border-color:rgba(52,211,153,.35)}
.dot{width:11px;height:11px;background:#475569;box-shadow:0 0 0 3px rgba(71,85,105,.22)}
.dot.on{background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.22),0 0 12px #10b981}
.rt{font-size:15.5px;font-weight:700;color:#f8fafc;letter-spacing:-.1px}
.rs{font-size:12px;color:#8b9bb4;margin-top:4px;line-height:1.4}
.rv{font-size:15px;font-weight:800;color:#fde047;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.22);padding:5px 10px;border-radius:10px}
.rv.warn{color:#fb923c;background:rgba(251,146,60,.12);border-color:rgba(251,146,60,.28)}
.xb{width:34px;height:34px;border-radius:11px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:14px;transition:.15s}
.xb:active{transform:scale(.92);background:rgba(239,68,68,.28)}

/* Карточки сводки (Hero) */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(16,185,129,.26) 0%,rgba(14,165,233,.22) 100%);border:1px solid rgba(52,211,153,.38);border-radius:20px;padding:16px 18px;margin:2px 0 14px;gap:4px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.hero::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(110,231,183,.8),transparent)}
.hero span{font-size:12.5px;font-weight:600;color:#a7f3d0}
.hero b{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.4px;margin:2px 0}
.hero a{color:#fde047;text-decoration:none;border-bottom:1px dashed rgba(253,224,71,.5);padding-bottom:1px}

/* Селект, заголовки секций и инфо-блоки */

.sel-btn-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sel-it:active{transform:scale(.98)}
.sel-it.on{background:rgba(16,185,129,.14);border-color:rgba(52,211,153,.5);box-shadow:0 6px 18px rgba(16,185,129,.16)}
.sel-it-l{display:flex;align-items:center;gap:10px;min-width:0}
.sel-it-nm{font-size:14.5px;font-weight:700;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
['lgEm','lgPw'].forEach(id=>{
 const el=document.getElementById(id);
 const clean=()=>{
  setTimeout(()=>{
   const v=el.value;
   if(!v)return;
   el.value=v.slice(0,-1);
   el.dispatchEvent(new Event('input',{bubbles:true}));
   el.value=v;
   el.dispatchEvent(new Event('input',{bubbles:true}));
  },50);
 };
 el.addEventListener('change',clean);
 el.addEventListener('animationstart',clean);
});
</script>
