<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EuroBaza</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<link rel="stylesheet" href="style.css?v=20261117225429">
</head><body>
<div id="instBar" class="inst-bar"><span id="instTxt">📲 Установите приложение на экран</span><div style="display:flex;align-items:center;gap:6px"><button id="instBtn" class="inst-btn" style="display:none" onclick="runInstall()">Установить</button><span class="inst-x" onclick="$('instBar').style.display='none';localStorage.setItem('INST_HIDE','1')">✕</span></div></div>
<h2><span>Доставка EuroBaza</span><span class="badge">🚚 <b id="cnt">0</b></span></h2>
<div class="grp top"><div class="inp-w"><input id="a" placeholder="Например: Абовяна 10, Ереван"><span id="mic" class="inp-mic" onclick="voice()">🎤</span><span class="inp-x" onclick="$('a').value='';if($('sg'))$('sg').innerHTML='';$('s').textContent='';$('a').focus()">✕</span></div>
<button onclick="add()">Добавить адрес</button>
<button onclick="askC('Очистить список адресов?','Очистить').then(y=>{if(y){P.length=0;save();window.toast&&toast('Список очищен')}})">Очистить</button></div>
<ol id="l"></ol>
<div class="grp"><label class="ret-box"><input type="checkbox" id="ret"><span class="ret-sw"></span><span class="ret-t">🏁 Вернуться на базу<small>Маршрут закончится на базе</small></span></label><button onclick="go()">Найти лучший порядок</button>
<button onclick="askC('Очистить построенный маршрут?','Очистить').then(y=>{if(y){$('o').innerHTML='';$('s').textContent='';localStorage.removeItem('R_SAVE');window.CUR=null;window.toast&&toast('Маршрут очищен')}})">Очистить</button></div>
<div id="s"></div><div id="o"></div>
<button class="fab fab-r" onclick="openPts()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>Точки</span></button>
<div id="ptMdl" class="mdl" onclick="if(event.target===this)this.classList.remove('open')"><div class="mdl-b pt-box"><div class="pt-hd"><div class="pt-hd-l"><div class="pt-hd-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div><div><div class="pt-hd-t">Точки без адреса</div><div class="pt-hd-s">Быстрый запуск навигатора</div></div></div><button type="button" class="pt-x" onclick="$('ptMdl').classList.remove('open')" aria-label="Закрыть">✕</button></div><div id="ptList" class="pt-list"></div><div class="pt-form"><div class="pt-fld"><svg class="pt-fic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><input id="pn" placeholder="Название точки"></div><div class="pt-fld pt-fld-c"><svg class="pt-fic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><input id="pc" placeholder="Координаты или нажмите 📍"><button type="button" class="pt-loc" onclick="fillPos()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button></div><button type="button" class="pt-add" onclick="addSpec()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Добавить точку</span></button><div id="ptMsg" class="pt-msg"></div></div></div></div></div>

<div id="cm" class="cm"><div class="cm-b"><div class="cm-i" id="cmI">🗑️</div><div class="cm-t" id="cmT"></div><div class="cm-r"><button id="cmNo">Отмена</button><button id="cmOk" class="cm-ok">OK</button></div></div></div>


<script src="app.js?v=20261117225429"></script>
<script src="yandex.js?v=20261117225429"></script>
<script src="ui.js?v=20261117225429"></script>
<script src="map.js?v=20261117225429"></script>
<script src="bonus.js?v=20261117225429"></script>
<script src="i18n.js?v=20261117225429"></script>
<script src="online.js?v=20261117225429"></script>
<script src="auth.js?v=20261117225429"></script>
</body></html>
