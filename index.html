<h2><span>Доставка EuroBaza</span><span class="badge">🚚 <b id="cnt">0</b></span></h2>
<div class="inp-w"><input id="a" placeholder="Например: Абовяна 10, Ереван"><span id="mic" class="inp-mic" onclick="voice()">🎤</span><span class="inp-x" onclick="$('a').value='';if($('sg'))$('sg').innerHTML='';$('s').textContent='';$('a').focus()">✕</span></div>

<button onclick="$('o').innerHTML='';$('s').textContent='';localStorage.removeItem('R_SAVE')">Очистить</button>
<div id="s"></div><div id="o"></div>
<script>
const $=id=>document.getElementById(id);
let P=JSON.parse(localStorage.getItem('P')||'[]');
function save(){localStorage.setItem('P',JSON.stringify(P));draw()}
function draw(){if($('cnt'))$('cnt').textContent=P.length;$('l').innerHTML=P.map((p,i)=>`<li class="${p.pin?'pin':''}"><span style="flex:1">${p.name}</span><div class="cbtns"><a class="st ${p.pin?'on':''}" href="#" onclick="pin(${i});return false">${p.pin?'⭐':'☆'}</a><a class="x" href="#" onclick="del(${i});return false">✕</a></div></li>`).join('')}
function del(i){P.splice(i,1);save()}
function pin(i){const v=!P[i].pin;P.forEach(x=>x.pin=false);P[i].pin=v;save()}
async function add(){
 const v=$('a').value.trim();if(!v)return;
 $('s').textContent='Ищу адрес...';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=am&accept-language=ru&q='+encodeURIComponent(v));
  const j=await r.json();
  if(!j.length){$('s').textContent='Адрес не найден, попробуйте написать иначе';return}
  P.push({name:j[0].display_name.split(',').slice(0,3).join(','),lat:+j[0].lat,lon:+j[0].lon});
  $('a').value='';$('s').textContent='';save();
 }catch(e){$('s').textContent='Ошибка сети'}
}
function pos(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),no,{enableHighAccuracy:true,timeout:15000}))}
$('a').onkeydown=ev=>{if(ev.key==='Enter')add()};
draw();

function voice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('s').textContent='Голосовой ввод не поддерживается в этом браузере';return}
 const r=new SR(),m=$('mic');
 r.lang='ru-RU';r.interimResults=false;
 r.onstart=()=>{m.classList.add('rec');$('s').textContent='Говорите адрес...'};
 r.onend=()=>{m.classList.remove('rec')};
 r.onerror=()=>{m.classList.remove('rec');$('s').textContent='Не удалось распознать голос'};
 r.onresult=e=>{const t=e.results.item(0).item(0).transcript;$('a').value=t;$('s').textContent='';add()};
 r.start();
}
</script><script src="yandex.js?v=20"></script><button class="fab" onclick="openPts()">📍 Точки</button>
<div id="ptMdl" class="mdl" onclick="if(event.target===this)this.classList.remove('open')"><div class="mdl-b"><div class="mdl-h"><span>Точки без адреса</span><button class="mdl-x" onclick="$('ptMdl').classList.remove('open')">✕</button></div><div id="ptList"></div><div class="pt-add"><input id="ptName" placeholder="Название новой точки"><input id="ptCoord" placeholder="Координаты: 40.163019, 44.388218"><div class="pt-add-btns"><button type="button" class="pt-btn-gps" onclick="fillMyPos()">📍 Моя геопозиция</button><button type="button" class="pt-btn-ok" onclick="addSpecPt()">+ Добавить</button></div><div id="ptMsg" style="font-size:12px;color:#ffd166;text-align:center"></div></div></div></div>
<script>
const DEF_PTS=[
 {name:'Артак',lat:40.163019,lon:44.388218},
 {name:'Геворг Спайка',lat:40.127240,lon:44.490112}
];
let SPEC_PTS=JSON.parse(localStorage.getItem('SPEC_PTS')||'null')||DEF_PTS;
function saveSpec(){localStorage.setItem('SPEC_PTS',JSON.stringify(SPEC_PTS))}
function delSpecPt(i){SPEC_PTS.splice(i,1);saveSpec();openPts()}
async function fillMyPos(){
 $('ptMsg').textContent='Определяю текущие координаты...';
 try{const m=await pos();$('ptCoord').value=m.lat.toFixed(6)+', '+m.lon.toFixed(6);$('ptMsg').textContent=''}
 catch(e){$('ptMsg').textContent='Не удалось получить GPS'}
}
function addSpecPt(){
 const nm=$('ptName').value.trim();
 const c=$('ptCoord').value.trim().split(/[\s,;]+/).map(Number);
 if(!nm){$('ptMsg').textContent='Введите название точки';return}
 if(c.length<2||isNaN(c[0])||isNaN(c[1])){$('ptMsg').textContent='Укажите координаты (широта, долгота)';return}
 SPEC_PTS.push({name:nm,lat:c[0],lon:c[1]});
 saveSpec();
 $('ptName').value='';$('ptCoord').value='';$('ptMsg').textContent='';
 openPts();
}
function drawSpec(me,dists,durs){
 if(!SPEC_PTS.length){$('ptList').innerHTML='<div style="text-align:center;color:#94a3b8;font-size:14px;padding:12px 0">Список точек пуст</div>';return}
 $('ptList').innerHTML=SPEC_PTS.map((p,i)=>{
  let info='';
  if(durs&&durs.at(i)!=null){
   const d=dists&&dists.at(i),km=d?' • '+(d<10000?(d/1000).toFixed(1):Math.round(d/1000))+' км':'';
   info=`<span class="t-tag" style="color:#34d399">⏱ ~${fmtT(durs.at(i))}${km}</span>`;
  }else if(me){
   const d=Math.hypot((me.lat-p.lat)*111000,(me.lon-p.lon)*85000)*1.35,t=d/11;
   const km=' • '+(d<10000?(d/1000).toFixed(1):Math.round(d/1000))+' км';
   info=`<span class="t-tag" style="color:#34d399">⏱ ~${fmtT(t)}${km}</span>`;
  }else{
   info=`<span class="t-tag" style="color:#94a3b8">Определяю геопозицию...</span>`;
  }
  return `<div class="pt-row"><a class="pt-i" href="yandexnavi://build_route_on_map?lat_to=${p.lat}&lon_to=${p.lon}"><span>${p.name}${info}</span><span style="color:#fc0">🧭 Поехали</span></a><button type="button" class="pt-del" onclick="delSpecPt(${i})">✕</button></div>`;
 }).join('');
}
async function openPts(){
 $('ptMdl').classList.add('open');
 drawSpec(null,null,null);
 if(!SPEC_PTS.length)return;
 let me;
 try{me=await pos()}catch(e){
  $('ptList').innerHTML=SPEC_PTS.map((p,i)=>`<div class="pt-row"><a class="pt-i" href="yandexnavi://build_route_on_map?lat_to=${p.lat}&lon_to=${p.lon}"><span>${p.name}<span class="t-tag" style="color:#fbbf24">Включите геолокацию для расчёта времени</span></span><span style="color:#fc0">🧭 Поехали</span></a><button type="button" class="pt-del" onclick="delSpecPt(${i})">✕</button></div>`).join('');
  return;
 }
 drawSpec(me,null,null);
 try{
  const allPts=new Array(me).concat(SPEC_PTS);
  const url='https://project-osrm.org(p=>p.lon+','+p.lat).join(';')+'?sources=0&annotations=duration,distance';
  const r=await fetch(url),j=await r.json();
  if(j.durations&&j.durations.at(0)){
   drawSpec(me,j.distances.at(0).slice(1),j.durations.at(0).slice(1));
  }
 }catch(e){}
}
</script>

<script>
const BASE={name:'🏁 Возврат на базу (Арин Берд 7)',lat:40.1328,lon:44.5046};
function solve(D,n,bIdx){const skipPen=(a,b,used)=>{let pen=0;for(let j=1;j<=n;j++)if(!used.at(j)&&j!==b){const det=D.at(a).at(j)+D.at(j).at(b)-D.at(a).at(b);if(det<900)pen+=3600}return pen};let best=new Array(),bc=Infinity;if(n<=8){const rec=(path,used,c)=>{if(c>=bc)return;if(path.length==n){const l=path.at(-1),t=c+(bIdx?D.at(l).at(bIdx):0);if(t<bc){bc=t;best=path.slice()}return}const last=path.length?path.at(-1):0;for(let i=1;i<=n;i++)if(!used.at(i)){const pen=skipPen(last,i,used);used[i]=1;path.push(i);rec(path,used,c+D.at(last).at(i)+pen);path.pop();used[i]=0}};const pI=P.findIndex(x=>x.pin)+1;if(pI>0){const u=new Array();u[pI]=1;rec(new Array(pI),u,D.at(0).at(pI))}else rec(new Array(),new Array(),0)}else{const used=new Array();let cur=0;const pI=P.findIndex(x=>x.pin)+1;if(pI>0){used[pI]=1;best.push(pI);cur=pI}for(let k=best.length;k<n;k++){let b=-1,bv=Infinity;for(let i=1;i<=n;i++)if(!used.at(i)){const v=D.at(cur).at(i)+skipPen(cur,i,used);if(v<bv){bv=v;b=i}}used[b]=1;best.push(b);cur=b}}return best}
function fmtT(s){const m=Math.round(s/60);return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин'}
function buildNav(arr){const to=arr.at(-1),via=arr.slice(0,-1);let u='yandexnavi://build_route_on_map?lat_to='+to.lat+'&lon_to='+to.lon;via.forEach((p,i)=>u+='&lat_via_'+i+'='+p.lat+'&lon_via_'+i+'='+p.lon);return u}
async function go(){if(!P.length)return;const back=$('ret').checked;$('o').innerHTML='';$('s').textContent='Определяю местоположение...';let me;try{me=await pos()}catch(e){$('s').textContent='Разрешите доступ к геолокации для Chrome';return}const pts=back?[me,...P,BASE]:[me,...P],bIdx=back?pts.length-1:0;$('s').textContent='Считаю лучший порядок...';let D;try{const r=await fetch('https://project-osrm.org'+pts.map(p=>p.lon+','+p.lat).join(';')+'?annotations=duration');D=(await r.json()).durations;if(!D)throw 0}catch(e){D=pts.map(a=>pts.map(b=>Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*85)*90))}let Dist=pts.map(a=>pts.map(b=>Math.hypot((a.lat-b.lat)*111000,(a.lon-b.lon)*85000)*1.35));const idx=solve(D,P.length,bIdx);if(back)idx.push(bIdx);try{const rPts=[pts.at(0),...idx.map(i=>pts.at(i))],rr=await fetch('https://project-osrm.org'+rPts.map(p=>p.lon+','+p.lat).join(';')+'?overview=false'),legs=(await rr.json()).routes.at(0).legs;if(legs)legs.forEach((leg,k)=>{const a=k===0?0:idx.at(k-1),b=idx.at(k);D[a][b]=leg.duration;Dist[a][b]=leg.distance})}catch(e){}let prev=0,totT=0,totD=0;let curOrder=idx.map(i=>{const sT=600+D.at(prev).at(i),sD=Dist.at(prev).at(i);totT+=sT;totD+=sD;prev=i;const sKm=sD?' • '+(sD<10000?(sD/1000).toFixed(1):Math.round(sD/1000))+' км':'';return{name:pts.at(i).name,lat:pts.at(i).lat,lon:pts.at(i).lon,sub:'+'+fmtT(sT)+sKm}});const startPt=pts.at(0);$('s').textContent='';const km=totD?' • '+Math.round(totD/1000)+' км':'',liHtml=curOrder.map(it=>`<li><span style="flex:1">${it.name}<span class="t-tag">(${it.sub})</span></span><span class="dh">☰</span></li>`).join('');renderOut(curOrder,startPt,totT,totD)}
function renderOut(curOrder,startPt,totT,totD){localStorage.setItem('R_SAVE',JSON.stringify({curOrder:curOrder,startPt:startPt,totT:totT,totD:totD}));const km=totD?' • '+Math.round(totD/1000)+' км':'',liHtml=curOrder.map(it=>`<li><span style="flex:1">${it.name}<span class="t-tag">(${it.sub})</span></span><span class="dh">☰</span></li>`).join('');$('o').innerHTML=`<h3>Порядок (потяните ☰):</h3><div class="stat">⏱ Весь путь: ~${fmtT(totT)}${km}</div><ol>${liHtml}</ol><a class="nav" href="${buildNav(curOrder)}">Открыть в Яндекс Навигаторе</a>`;const ol=$('o').querySelector('ol');let dragEl=null;ol.addEventListener('touchstart',ev=>{const h=ev.target.closest('.dh');if(!h)return;dragEl=h.closest('li');dragEl.classList.add('drag')},{passive:true});ol.addEventListener('touchmove',ev=>{if(!dragEl)return;ev.preventDefault();const over=document.elementFromPoint(ev.touches.item(0).clientX,ev.touches.item(0).clientY),target=over&&over.closest('#o ol li');if(target&&target!==dragEl){const items=Array.from(ol.children),fromI=items.indexOf(dragEl),toI=items.indexOf(target);if(fromI<toI)target.after(dragEl);else target.before(dragEl);curOrder.splice(toI,0,curOrder.splice(fromI,1).at(0))}},{passive:false});ol.addEventListener('touchend',async()=>{if(!dragEl)return;dragEl.classList.remove('drag');dragEl=null;const navA=document.querySelector('#o a.nav');if(navA)navA.href=buildNav(curOrder);let tT=totT,tD=totD;try{const rPts=new Array(startPt).concat(curOrder),rr=await fetch('https://project-osrm.org'+rPts.map(p=>p.lon+','+p.lat).join(';')+'?overview=false'),legs=(await rr.json()).routes.at(0).legs;if(legs){tT=0;tD=0;const lis=ol.querySelectorAll('li');legs.forEach((leg,k)=>{const sT=600+leg.duration,sD=leg.distance;tT+=sT;tD+=sD;const sKm=sD?' • '+(sD<10000?(sD/1000).toFixed(1):Math.round(sD/1000))+' км':'',sub='+'+fmtT(sT)+sKm;curOrder.at(k).sub=sub;const tag=lis.item(k)&&lis.item(k).querySelector('.t-tag');if(tag)tag.textContent='('+sub+')'});const st=document.querySelector('#o .stat');if(st)st.textContent='⏱ Весь путь: ~'+fmtT(tT)+(tD?' • '+Math.round(tD/1000)+' км':'')}}catch(e){}localStorage.setItem('R_SAVE',JSON.stringify({curOrder:curOrder,startPt:startPt,totT:tT,totD:tD}))})}
try{const sv=JSON.parse(localStorage.getItem('R_SAVE')||'null');if(sv&&sv.curOrder&&sv.curOrder.length)renderOut(sv.curOrder,sv.startPt,sv.totT,sv.totD)}catch(e){}
</script>
